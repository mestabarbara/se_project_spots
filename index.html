<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="author" content="Mary Santabarbara"/><meta name="description" content="This is a social media app, used to share photos with friends and family."/><meta name="keywords" content="photo, picture, video, social, media, share"/><title>Spots</title><link rel="icon" href="favicon.ico"><script defer="defer" src="main.js"></script><link href="main.css" rel="stylesheet"></head><body><div class="page"><header class="header"><img src="ce1b93020621958c5ad4.svg" alt="Spots Logo" class="header__logo"/></header><main class="content"><section class="profile"><img src="2fc47fd8e9a9bcd9612f.jpg" alt="profile picture for user" class="profile__avatar"/><div class="profile__column"><h1 class="profile__name">Bessie Coleman</h1><p class="profile__description">Civil Aviator</p><button type="button" class="profile__edit-button"><img src="3f562ce83766a824571e.svg" alt="pencil icon"/> Edit Profile</button></div><button type="button" class="profile__add-button"><img src="975792ea68af0a3c209d.svg" alt="plus icon"/> New Post</button></section><section class="cards"><ul class="cards__list"><template id="card-template"><li class="card"><button class="card__delete card__delete-button" type="button"></button> <img src="#" alt="" class="card__image"/><div class="card__content"><h2 class="card__title"></h2><button type="button" class="card__like-button"></button></div></li></template></ul></section></main><footer class="footer"><p class="footer__copyright">2025 &copy; Spots</p></footer><div class="modal" id="image-preview-modal"><div class="modal__popup" id="modal-image-container"><img class="modal__image" src="#" alt="Empty Picture"/> <button type="button" class="modal__close-button modal__close-button_preview" id="image-close-button"><img src="2a6d443422ae27e8b633.svg" alt="close out button"/></button><p class="modal__image-caption">No caption inputted</p></div></div><div class="modal" id="edit-profile-modal"><div class="modal__popup"><button type="button" class="modal__close-button modal__close-button_profile"><img src="077de99f47bea9909684.svg" alt="close out button"/></button><h2 class="modal__title">Edit Profile</h2><form class="modal__form" novalidate><label for="profile-name-input" class="modal__label">Name <input id="profile-name-input" class="modal__input" placeholder="Type your name" required minlength="2" maxlength="40"/> <span class="modal__error">Please fill out this field.</span></label> <label for="profile-description-input" class="modal__label">Description <input id="profile-description-input" class="modal__input" placeholder="Describe yourself" required minlength="2" maxlength="200"/> <span class="modal__error">Please lengthen this text to 2 characters or more (you are currently usina 1 character).</span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div><div class="modal" id="new-post-modal"><div class="modal__popup"><button type="button" class="modal__close-button modal__close-button_type_newpost"><img src="077de99f47bea9909684.svg" alt="close out button"/></button><h2 class="modal__title">New Post</h2><form class="modal__form" novalidate><label for="new-image-input" class="modal__label">Image link <input id="new-image-input" type="url" class="modal__input" placeholder="Paste a link to the picture" required/> <span class="modal__error"></span></label> <label for="new-image-caption-input" class="modal__label">Caption <input id="new-image-caption-input" class="modal__input" placeholder="Type your caption" required minlength="2" maxlength="30"/> <span class="modal__error"></span></label> <button type="submit" class="modal__submit-button">Save</button></form></div></div></div></body></html>
